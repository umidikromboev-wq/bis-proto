name: Preview deploy

# Зачем этот файл.
#
# Vercel не собирает ветку, если автор коммита не состоит в команде Vercel:
# сборка встаёт в BLOCKED и ждёт подтверждения владельца. Продакшен эту проблему
# уже обошёл через deploy.yml (Deploy Hook), но превью на ветках оставались
# заблокированными — разработчик не мог посмотреть свою правку до мержа.
#
# Здесь превью собирает не автор коммита, а сам репозиторий: Vercel CLI
# запускается с токеном из секретов, и такая сборка авторизована всегда.
#
# Триггер — push в ветку, а НЕ pull_request. Репозиторий публичный, и на
# pull_request из форка GitHub секреты не отдаёт: workflow молча падал бы.
# Push в ветку внутри репозитория секреты получает, а форки сюда не попадают.
#
# ВАЖНО про красные галочки. Раньше здесь был один job, и он падал, если
# VERCEL_TOKEN отсутствовал или протух. Автор пуша видел красный крест и думал,
# что сломал код, хотя код даже не проверялся. Теперь работа разделена:
#
#   build   — настоящая проверка кода, токен не нужен, падает только по делу;
#   preview — деплой превью, необязательный: без рабочего токена он пропускается
#             или помечается как некритичный и галочку не красит.
#
# Токен (когда нужны превью-ссылки): https://vercel.com/account/tokens,
# скоуп «Umid's projects» → Settings → Secrets and variables → Actions →
# VERCEL_TOKEN. ID проекта и команды секретами не являются и лежат ниже открыто.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_Xzk9kCAFdGd48k7Asz52qAJM
  VERCEL_PROJECT_ID: prj_HS3TdA1CJ5TINd5vL9pR40AOP0zG

jobs:
  # Проверка кода. Именно она отвечает за цвет галочки в ветке и в PR.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Поставить зависимости
        run: npm ci

      - name: Собрать проект
        run: npm run build

  # Превью-ссылка. Полезно, но не обязательно: если токена нет или он протух,
  # ветка всё равно остаётся зелёной — код-то в порядке.
  preview:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Есть ли токен
        id: token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN не задан — превью-ссылки не будет. Код проверен в job «build»."
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.has == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.has == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Поставить Vercel CLI
        if: steps.token.outputs.has == 'true'
        run: npm install --global vercel@latest

      - name: Забрать настройки окружения preview
        if: steps.token.outputs.has == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Собрать
        if: steps.token.outputs.has == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Выложить превью
        id: deploy
        if: steps.token.outputs.has == 'true'
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Превью: $url"

      - name: Написать адрес в сводку сборки
        if: steps.token.outputs.has == 'true'
        run: |
          echo "### Превью ветки \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
